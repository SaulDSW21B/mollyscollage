<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Mascotas | Galería de fotos</title>
  <meta name="description" content="Galería de fotografías tipo collage con todos nuestros momentos favoritos, filtrable por mascota.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/galeria.css">
</head>
<body>

  <header class="site-header">
    <nav class="navbar container" aria-label="Navegación principal">
      <a href="index.html" class="brand"><span class="paw">🐾</span> Mis Mascotas</a>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="mascotas.html">Mis mascotas</a></li>
        <li><a href="galeria.html" aria-current="page">Galería</a></li>
        <li><a href="recuerdos.html">Recuerdos</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" aria-label="Cambiar a modo oscuro">🌙</button>
        <button class="hamburger" aria-label="Abrir menú" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>

  <main class="container">
    <section class="page-header reveal">
      <h1>Galería</h1>
      <p>Un collage de nuestros mejores momentos. Haz clic en cualquier foto para verla en grande.</p>
    </section>

    <div class="filters" role="group" aria-label="Filtrar galería por categoría">
      <button class="filter-btn is-active" data-filter="todas">Todas</button>
      <button class="filter-btn" data-filter="mascota1">Mascota 1</button>
      <button class="filter-btn" data-filter="mascota2">Mascota 2</button>
      <button class="filter-btn" data-filter="momentos">Momentos</button>
    </div>

    <div class="collage-grid" id="galeria-grid" aria-label="Fotografías de la galería">
      <!-- Las fotos se generan automáticamente desde js/galeria.js -->
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Fotografía ampliada">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightbox-close" aria-label="Cerrar">✕</button>
      <button class="lightbox-btn lightbox-prev" id="lightbox-prev" aria-label="Foto anterior">‹</button>
      <img id="lightbox-img" src="" alt="">
      <button class="lightbox-btn lightbox-next" id="lightbox-next" aria-label="Foto siguiente">›</button>
      <p class="lightbox-counter" id="lightbox-counter"></p>
    </div>
  </div>

  <footer class="site-footer container">
    <div class="footer-stats">
      <span>🐾 3 mascotas</span>
      <span>📷 10 recuerdos</span>
      <span>❤️ Muchos momentos</span>
    </div>
    <p class="footer-date"></p>
  </footer>

  <button class="back-to-top" aria-label="Volver arriba">↑</button>

  <script src="js/main.js"></script>
  <script src="js/galeria.js"></script>
</body>
</html>
